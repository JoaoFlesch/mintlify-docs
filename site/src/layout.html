<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
<meta name="theme-color" content="#4f39f6">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ogImage}}">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 1000'%3E%3Crect width='1000' height='1000' rx='154.23' ry='154.23'/%3E%3Cpath fill='%23fff' d='M874.95,190.76h-98.26c-18.76,0-36.39,8.97-47.43,24.14l-300.38,412.65h-175.69l279.1-383.42c16.16-22.2.3-53.36-27.16-53.36h-99.21c-18.17,0-35.24,8.69-45.94,23.38L97.9,574.2c-16.16,22.2-.3,53.36,27.16,53.36h128.12l171.77,171.77c21.17,21.17,57.35,6.17,57.35-23.75v-148.03h140.7l171.77,171.77c21.17,21.17,57.34,6.17,57.34-23.75v-114.43c0-18.55-15.04-33.6-33.6-33.6h-195.51l279.1-383.42c16.16-22.2.3-53.36-27.16-53.36h0Z'/%3E%3C/svg%3E">
<script>
(function(){try{var t=localStorage.getItem('tu-theme');if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>{{css}}</style>
</head>
<body>
<header class="header">
	<div class="header-row">
		<button class="icon-btn menu-btn" type="button" data-menu-toggle aria-label="Abrir menu">{{icon:menu}}</button>
		<a class="logo" href="/" aria-label="Trackup Docs">{{logoLight}}{{logoDark}}<span class="logo-tag">Docs</span></a>
		<button class="search-btn" type="button" data-search-open aria-label="Buscar">{{icon:search}}<span class="search-label">Buscar na documentação</span><kbd>Ctrl K</kbd></button>
		<div class="header-actions">
			<button class="icon-btn" type="button" data-theme-toggle aria-label="Alternar tema claro e escuro">{{icon:moon}}</button>
			<a class="btn-primary" href="{{appUrl}}" target="_blank" rel="noopener"><span>Abrir o Trackup</span>{{icon:arrow}}</a>
		</div>
	</div>
	<nav class="tabs-bar" aria-label="Seções"><div class="tabs-row">{{tabs}}</div></nav>
</header>

<div class="{{layoutClass}}">
	<aside class="sidebar" aria-label="Navegação">{{sidebar}}</aside>
	<main>
		<article class="content">
			<div class="eyebrow">{{eyebrow}}</div>
			<h1 class="page-title">{{pageTitle}}</h1>
			{{pageDesc}}
			{{pageActions}}
			{{content}}
			{{pager}}
			<footer class="site-footer">
				<span>© {{year}} Trackup</span>
				<a href="{{homeUrl}}" target="_blank" rel="noopener">trackup.me</a>
				<a href="{{appUrl}}" target="_blank" rel="noopener">Painel</a>
				<a href="/llms.txt">llms.txt</a>
			</footer>
		</article>
	</main>
	{{toc}}
</div>

<div class="search-modal" role="dialog" aria-modal="true" aria-label="Buscar">
	<div class="search-box">
		<div class="search-input-row">{{icon:search}}<input type="search" placeholder="Buscar páginas, recursos, integrações…" autocomplete="off"><kbd>Esc</kbd></div>
		<div class="search-results"></div>
	</div>
</div>
{{searchScript}}
<script>{{js}}</script>
</body>
</html>
